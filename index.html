<style>

  --bg:#f4f6f9; --card:#ffffff; --card2:#f0f3f8; --text:#1b1f27; --sub:#68727f;
  --line:#e4e8ee; --pri:#2f6fed; --pri-soft:#e8effd; --ok:#1e9e55; --ok-soft:#e3f5ea;
  --bad:#e5484d; --bad-soft:#fdebec; --warn:#c47f17; --warn-soft:#fbf1dd;

html[data-theme="dark"]{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);

  padding-bottom:env(safe-area-inset-bottom)}
#topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;min-height:52px}
#topbar .tb-title{font-weight:700;font-size:1.02rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border:none;background:none;color:var(--text);border-radius:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.iconbtn:active{background:var(--card2)}

#view{max-width:720px;margin:0 auto;padding:.9rem .9rem 5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;box-shadow:var(--sh);margin-bottom:.9rem}
.card h3{margin:0 0 .6rem;font-size:1rem}
.sub{color:var(--sub);font-size:.85rem}
.row{display:flex;align-items:center;gap:.6rem}
.grow{flex:1}
.btn{border:none;border-radius:12px;padding:.7rem 1rem;font-size:.95rem;font-weight:600;cursor:pointer;
  background:var(--pri);color:#fff;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card2);color:var(--text)}

.btn.bad{background:var(--bad)}
.btn.small{padding:.4rem .7rem;min-height:40px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .55rem;border-radius:99px;font-size:.75rem;font-weight:600}
.chip.blue{background:var(--pri-soft);color:var(--pri)}
.chip.green{background:var(--ok-soft);color:var(--ok)}
.chip.red{background:var(--bad-soft);color:var(--bad)}
.chip.gray{background:var(--card2);color:var(--sub)}
.pill-list{display:flex;flex-direction:column;gap:.55rem}
.pill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.85rem .9rem;

.pill:active{background:var(--card2)}
.pill .pt{font-weight:600;font-size:.93rem;line-height:1.35}

.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar>i.g{background:var(--ok)}

.q-type{font-size:.78rem;font-weight:700;color:var(--pri)}
.q-stem{font-size:1.05rem;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin:.5rem 0 1rem}
.mat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin:.5rem 0;font-size:.92rem;line-height:1.65;white-space:pre-wrap;word-break:break-word}

.opt{display:flex;gap:.6rem;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);

  min-height:44px;word-break:break-word;transition:border-color .12s,background .12s}
.opt .ol{font-weight:700;color:var(--sub);flex:0 0 auto}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .ol{color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ol{color:var(--ok)}
.opt.wrongp{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrongp .ol{color:var(--bad)}
.opt.miss{border-color:var(--warn);background:var(--warn-soft)}
.opt.miss .ol{color:var(--warn)}
.opt.dim{opacity:.55}
.opt input{pointer-events:none}
.exp-wrap{border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;margin-top:.8rem;background:var(--card2)}
.exp-title{font-weight:700;font-size:.85rem;color:var(--pri);margin-bottom:.35rem}
.exp{font-size:.92rem;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.exp.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.exp-toggle{background:none;border:none;color:var(--pri);font-weight:600;padding:.35rem 0 0;cursor:pointer;font-size:.85rem}
.fb{display:flex;align-items:center;gap:.4rem;font-weight:700;margin-bottom:.4rem;font-size:.92rem}
.fb.good{color:var(--ok)} .fb.badd{color:var(--bad)}

.q-stem img,.mat img,.opt .grow img{display:block;max-width:100%;height:auto;margin:.6em auto;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-out}
.opt .grow img{max-height:170px;width:auto;pointer-events:auto}

.q-stem u,.mat u,.opt .grow u{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1.5px;font-style:normal}
.imgzoom{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:zfadeIn .15s ease}
.imgzoom img{max-width:100vw;max-height:94vh;object-fit:contain;border:none;border-radius:0;background:transparent}
.imgzoom .ztip{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:.8rem;opacity:.65;pointer-events:none}
@keyframes zfadeIn{from{opacity:0}to{opacity:1}}
.qnav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);

.qnav .btn{min-width:96px}
.qnav .pos{font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.qnav .progress{appearance:none;border:none;background:transparent;flex:1;cursor:pointer;

.qnav .progress:active{background:var(--card2)}
.qnav .progress .ok{color:var(--ok);font-weight:700}
.qnav .progress .bad{color:var(--bad);font-weight:700}
.qnav .progress .blank{color:var(--warn);font-weight:700}
.qhead{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn);font-size:.95rem}
.timer.hot{color:var(--bad)}
.starbtn svg{fill:none}
.starbtn.on svg{fill:var(--warn);stroke:var(--warn)}

.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:.45rem}
.sheet button{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);

.sheet button.ans{background:var(--pri);border-color:var(--pri);color:#fff}

.sheet button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.sheet button.blank{background:var(--warn);border-color:var(--warn);color:#000;font-weight:800}
.sheet button.cur{outline:2.5px solid var(--warn);outline-offset:1px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.4rem}
.sheet-head h3{margin:0}
.sheet-counts{display:flex;gap:.55rem;align-items:center;font-size:.85rem;font-weight:700}
.sheet-counts .cok{color:var(--ok)}
.sheet-counts .cbad{color:var(--bad)}
.sheet-counts .cblank{color:var(--warn)}

.field{margin-bottom:.9rem}

.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--sub)}

#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(8,10,14,.55);padding:1.2rem}
#modal.show{display:flex}
#modal .box{background:var(--card);border-radius:16px;padding:1.2rem;max-width:420px;width:100%;max-height:80vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);z-index:120;display:none;

.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--sub);padding:2.2rem 1rem;line-height:1.7}
.hr{height:1px;background:var(--line);margin:.7rem 0}
.big{font-size:1.5rem;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
/* 翻页滑动动画：下一题从右滑入，上一题从左滑入；仅在 move() 触发时播放 */
.qwrap{will-change:transform,opacity}
.slide-next{animation:qNext .24s cubic-bezier(.25,.8,.35,1)}
.slide-prev{animation:qPrev .24s cubic-bezier(.25,.8,.35,1)}
@keyframes qNext{from{opacity:0;transform:translateX(52px)}to{opacity:1;transform:none}}
@keyframes qPrev{from{opacity:0;transform:translateX(-52px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide-next,.slide-prev{animation:none}}
/* 更新通知横幅 */
#updbar{position:fixed;top:0;left:0;right:0;z-index:130;display:none;align-items:center;gap:.7rem;
  padding:.65rem 1rem calc(.65rem + env(safe-area-inset-top));background:#1f6feb;color:#fff;

@media (max-width:420px){.stat-grid{grid-template-columns:repeat(3,1fr)}.q-stem{font-size:1rem}}

var bankIndex = null;                 // [{id,name,cat,date,n,na}]
var paperCache = {};                  // id -> {id,name,cat,date,qs:[...]}
function qKey(p,n){ return p+":"+n; }
/* 题库数据 URL 带上版本号作缓存戳：版本更新 → URL 变化 → 绕过浏览器 HTTP 缓存，
   否则更新横幅刷新后 index.json/分片仍可能吃旧缓存（20卷bug根因） */
function dataUrl(path){
  var v = localStorage.getItem(K+"ver") || "";
  return "data/"+path+(v ? "?v="+v : "?t="+Date.now());
}
function loadIndex(){ return fetch(dataUrl("index.json")).then(function(r){ if(!r.ok) throw 0; return r.json(); }); }
function loadPaper(id){
  if (paperCache[id]) return Promise.resolve(paperCache[id]);
  return fetch(dataUrl(id+".json")).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(p){ paperCache[id]=p; return p; });
}
function loadPapers(ids){ return Promise.all(ids.map(loadPaper)); }
function getQ(qk){
  var i = qk.lastIndexOf(":");
  var p = paperCache[qk.slice(0,i)];
  if (!p) return null;
  var no = +qk.slice(i+1);
  for (var j=0;j<p.qs.length;j++) if (p.qs[j].no===no) return p.qs[j];
  return null;
}

/* ================= 计算层 ================= */
function normSel(s){ return (s||"").split("").sort().join(""); }
function normJudge(a){
  // 判断题答案兼容：源文件可能存 A/B，界面传值是"正确"/"错误"
  a=(a||"").trim();
  if (a==="A"||a==="a"||a==="√"||a==="T"||a==="对"||a==="是") return "正确";
  if (a==="B"||a==="b"||a==="×"||a==="X"||a==="F"||a==="错"||a==="否") return "错误";
  return a;
}
function judge(q, sel){
  if (!sel) return false;
  if (q.t==="multi" || q.t==="uncertain") return normSel(sel)===normSel(q.a);
  if (q.t==="judge") return normJudge(sel)===normJudge(q.a);
  return sel===q.a;
}
function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayRec(){ return records[todayKey()] || {c:0,r:0,s:0}; }
function streakDays(){
  var n=0, d=new Date();
  if (!records[todayKey()]) d.setDate(d.getDate()-1);   // 今天还没刷不打断连续
  for(;;){
    var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if (records[k] && records[k].c>0){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function totalStats(){ var c=0,r=0,s=0; for(var k in records){ c+=records[k].c; r+=records[k].r; s+=records[k].s; } return {c:c,r:r,s:s}; }
function addRecord(correct, seconds){
  var k=todayKey(), r=records[k]||(records[k]={c:0,r:0,s:0});
  r.c++; if(correct) r.r++; r.s+=seconds;
  save("records", records);
  if (!settings.backupHint && totalStats().c>=30){
    settings.backupHint=true; save("settings",settings);
    toast("已积累 30+ 条刷题记录，建议在设置里导出备份");
  }
}
function markAnswered(qk, ok){
  doneMap[qk] = ok?"right":"wrong";
  if (!ok){
    var w=wrongMap[qk];
    if (w){ w.at=Date.now(); w.streak=0; } else { wrongMap[qk]={p:qk.slice(0,qk.lastIndexOf(":")),n:+qk.slice(qk.lastIndexOf(":")+1),at:Date.now(),streak:0}; }
  } else if (wrongMap[qk]){
    wrongMap[qk].streak=(wrongMap[qk].streak||0)+1;
    if (wrongMap[qk].streak>=2){ delete wrongMap[qk]; return "mastered"; }
  }
  save("done",doneMap); save("wrong",wrongMap);
  return null;
}
function paperStat(pid){
  // 不依赖 paperCache：用 bankIndex 取总题数 + progress.answers 取已做答数（任一卷子立即可得）
  var meta = bankIndex.find(function(x){return x.id===pid;})||{};
  var total = meta.n||0;
  var prog = progress[pid]||{};
  var done = Object.keys(prog.answers||{}).length;
  var ps = paperStats[pid]||{};
  var answered = ps.answered||0, correct = ps.correct||0;
  return {
    done:done, total:total,
    sessions:ps.sessions||0,
    answered:answered, correct:correct,
    accuracy:answered ? Math.round(correct*100/answered) : 0,
    pct: total ? Math.round(done*100/total) : 0
  };
}
function addPaperStat(pid, answered, correct){
  if (!pid) return;
  var s = paperStats[pid] || (paperStats[pid]={sessions:0,answered:0,correct:0});
  s.sessions = (s.sessions||0)+1;
  s.answered = (s.answered||0)+(answered||0);
  s.correct  = (s.correct ||0)+(correct ||0);
  save("paperStats", paperStats);
  scheduleSync();
}

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* 题干渲染：放行 <img> 标签（含 data: base64 内联图），其余按 esc 转义 */
function renderStem(s){
  if(!s) return "";
  var imgs=[];
  var t=s.replace(/<img\b[^>]*\/?>/gi,function(m){ imgs.push(m); return "\u0001_IMG_"+(imgs.length-1)+"_\u0001"; });
  t=t.replace(/<br\s*\/?>/gi,"\u0001_BR_\u0001");
  t=t.replace(/<u>/gi,"\u0001_UO_\u0001").replace(/<\/u>/gi,"\u0001_UC_\u0001");
  t=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  return t.replace(/\u0001_IMG_(\d+)_\u0001/g,function(_,i){ return imgs[+i]||""; })
          .replace(/\u0001_BR_\u0001/g,"<br>")
          .replace(/\u0001_UO_\u0001/g,"<u>").replace(/\u0001_UC_\u0001/g,"</u>");
}
function stripU(s){ return (s||"").replace(/<\/?u>/gi,""); }

function zoomImg(src){

}

function renderQuiz(){
  topbar(app.quiz.title, true);
  var qz=app.quiz, q=qz.list[qz.order[qz.idx]];
  if (!q){ nav("home",false); return; }
  var h='';
  h += '<div class="qhead">'+catChip(q.paperCat||"")+
    '<span class="q-type">'+TYPE_LABEL[q.t]+'</span>'+
    (qz.mode==="recite" ? '<span class="chip blue">背题</span>' : "")+
    (qz.mode==="exam" ? '<span class="timer" id="examTimer"></span>' : "")+
    '<span class="grow"></span>'+
    '<button class="iconbtn starbtn '+(favMap[q.qk]?"on":"")+'" onclick="toggleFav()" aria-label="收藏">'+svg("star")+'</button>'+
    '<button class="iconbtn" onclick="showSheet()" aria-label="答题卡">'+svg("list")+'</button></div>';
  if (q.md || q.m) h += '<div class="mat">'+(q.md?'<div class="md">'+esc(q.md)+'</div>':"")+renderStem(q.m||"")+'</div>';
  h += '<div class="q-stem">'+renderStem(q.s)+'</div>';
  var sel = qz.answers[q.qk]||"";
  var revealed = (qz.mode==="practice" && qz.revealed[q.qk]) || qz.mode==="recite";
  // 判断题：选项为空/全空白时也用「正确/错误」（部分卷判断题的选项被解析成空串数组）
  var _hasOpt = (q.o||[]).some(function(x){ return (x||"").trim(); });
  var opts = q.t==="judge" && !_hasOpt ? ["正确","错误"] : q.o;
  for (var i=0;i<opts.length;i++){
    var L = String.fromCharCode(65+i), v = q.t==="judge" ? opts[i] : L;
    var cls="opt";
    if (revealed){
      var inAns = q.t!=="judge" && normSel(q.a).indexOf(v)>=0;
      if (q.t==="judge" ? normJudge(v)===normJudge(q.a) : inAns) cls+=" right";
      if (qz.mode==="practice" && qz.revealed[q.qk]){
        // 多选/不定项逐项标色：错选红、漏选黄、选对绿
        if ((q.t==="multi"||q.t==="uncertain")){
          if (inAns && sel.indexOf(v)<0){ cls=cls.replace(" right","")+" miss"; }   // 漏选
          if (!inAns && sel.indexOf(v)>=0) cls+=" wrongp";                           // 错选
        } else {
          if (sel.indexOf(v)>=0 && !judge(q,sel)) cls+=" wrongp";
          if (q.t==="judge" && sel===v && !judge(q,sel)) cls+=" wrongp";
        }
      }
      if (cls==="opt") cls+=" dim";
    } else if (sel.indexOf(v)>=0 && (q.t==="multi"||q.t==="uncertain"||sel===v)) cls+=" sel";
    h += '<div class="'+cls+'" '+(qz.mode==="recite"?"":'onclick="pickOpt(\''+v+'\')"')+'><span class="ol">'+L+'.</span><span class="grow">'+renderStem(opts[i])+'</span></div>';
  }
  if ((q.t==="multi"||q.t==="uncertain") && !revealed && qz.mode==="practice"){
    h += '<button class="btn block" style="margin-top:.4rem" '+(sel?"":"disabled style2 opacity:.5")+' onclick="confirmMulti()">确认答案</button>';
  }
  if (revealed){
    if (qz.mode==="recite"){
      h += '<div class="exp-wrap"><div class="fb" style="color:var(--pri);font-weight:700">正确答案：'+esc(q.t==="judge"?normJudge(q.a):normSel(q.a))+'</div>'+
        '<div class="exp-title">解析</div><div class="exp'+(qz.expOpen?"":" clamp")+'" id="expBody">'+(q.e?renderStem(q.e):"无")+'</div>'+
        (q.e?'<button class="exp-toggle" onclick="toggleExp()">'+(qz.expOpen?"收起":"展开全文")+'</button>':"")+'</div>';
    } else {
      var ok = judge(q, sel);
      h += '<div class="exp-wrap"><div class="fb '+(ok?"good":"badd")+'">'+svg(ok?"check":"x").replace("<svg",'<svg width="16" height="16"')+' '+(ok?"回答正确":"回答错误")+
        (ok?"":' · 正确答案：'+esc(q.t==="judge"?normJudge(q.a):normSel(q.a)))+'</div>'+
        '<div class="exp-title">解析</div><div class="exp'+(qz.expOpen?"":" clamp")+'" id="expBody">'+(q.e?renderStem(q.e):"无")+'</div>'+
        (q.e?'<button class="exp-toggle" onclick="toggleExp()">'+(qz.expOpen?"收起":"展开全文")+'</button>':"")+'</div>';
    }
  }
  var dir = qz._slideDir || 0; qz._slideDir = 0;   // 只在本次渲染播放动画，答题重渲染不重播
  if (dir) h = '<div class="qwrap '+(dir>0?"slide-next":"slide-prev")+'">'+h+'</div>';
  document.getElementById("view").innerHTML = h;
  // 底部导航
  var _ansN = Object.keys(qz.answers||{}).length;
  var _revN = Object.keys(qz.revealed||{}).length;
  var _prog;
  if (qz.mode==="practice"){
    var _ok=0,_bad=0; Object.keys(qz.revealed).forEach(function(qk){
      var it=qz.list.find(function(x){return x.qk===qk;});
      if (it && judge(it, qz.answers[qk])) _ok++; else _bad++;
    });
    _prog = '<span>'+(qz.idx+1)+'/'+qz.list.length+'</span><span class="ok">✓'+_ok+'</span><span class="bad">✗'+_bad+'</span><span class="blank">·'+(qz.list.length-_revN)+'</span>';
  } else if (qz.mode==="exam"){
    _prog = '<span>'+(qz.idx+1)+'/'+qz.list.length+'</span><span style="color:var(--sub)">已答 '+_ansN+'</span><span class="blank">·'+(qz.list.length-_ansN)+'</span>';
  } else {
    _prog = '<span>'+(qz.idx+1)+'/'+qz.list.length+'</span><span style="color:var(--sub)">已看 '+_ansN+'</span>';
  }
  var nav_ = '<div class="qnav">'+
    '<button class="btn ghost" '+(qz.idx===0?"disabled style='opacity:.4'":"")+' onclick="move(-1)">上一题</button>'+
    '<button class="progress" onclick="showSheet()" aria-label="查看答题卡">'+_prog+'</button>'+
    (qz.mode==="exam"
      ? '<button class="btn bad" onclick="exitExam()">交卷</button>'
      : (qz.idx===qz.list.length-1
        ? '<button class="btn ok" onclick="finishPractice()">完成</button>'
        : '<button class="btn" onclick="move(1)">下一题</button>'))+
    '</div>';
  document.getElementById("view").insertAdjacentHTML("beforeend", nav_);
  document.getElementById("view").insertAdjacentHTML("beforeend",
    '<div class="sub" style="text-align:center;font-size:.75rem;opacity:.55;padding:.2rem 0 .8rem">← 左滑 / 拖拽下一题 · 右滑上一题 →</div>');
  if (qz.mode==="exam") tickTimer();
}

function refresh(){
  applyTheme();
  if (app.view==="quiz" && !app.quiz){ app.view="home"; app.stack=[]; }   // 空测试态保护
  switch(app.view){
    case "home": renderHome(); break;
    case "category": renderCategory(); break;
    case "picker": renderPaperPicker(); break;
    case "quiz": renderQuiz(); break;
    case "result": renderResult(); break;
    case "wrong": renderWrong(); break;
    case "fav": renderFav(); break;
    case "custom": renderCustom(); break;
    case "stats": renderStats(); break;

  if (paperCache[pid]) return paperCache[pid].name;

}

/* ================= 事件与业务逻辑 ================= */
function openCat(cat){ app.cat=cat; nav("category"); }
function openPaper(pid){ app.paperId=pid; showLoading("加载试卷…");
  loadPaper(pid).then(function(){ hideLoading(); nav("picker"); }).catch(function(){ hideLoading(); toast("试卷加载失败"); }); }
function resumePaper(pid){
  var prog=progress[pid]; if(!prog){ startPaper(pid,"practice"); return; }
  showLoading("恢复进度…");
  loadPaper(pid).then(function(p){
    hideLoading();
    var list=p.qs.map(function(q){ return mkQ(p,q); });
    // 已作答过的题回填 revealed：继续作答往回翻时仍显示对错与解析
    var ans=prog.answers||{}, rev={};
    if (prog.revealed && Object.keys(prog.revealed).length){
      rev = prog.revealed;
    } else {
      // 旧进度无 revealed 字段：只对单选/判断回填（多选未点"确认答案"的不算已作答，避免误判）
      var byQk={}; list.forEach(function(it){ byQk[it.qk]=it; });
      Object.keys(ans).forEach(function(k){
        var v=ans[k], it=byQk[k];
        if (v && (!Array.isArray(v) || v.length) && it && it.t!=="multi" && it.t!=="uncertain") rev[k]=true;
      });
    }
    startQuiz({mode:"practice", title:p.name, list:list, order:list.map(function(_,i){return i;}),
      idx:Math.min(prog.idx||0,list.length-1), answers:ans, revealed:rev, source:"paper", paperId:pid});
  }).catch(function(){ hideLoading(); toast("加载失败"); });
}
function mkQ(p,q){ return {qk:qKey(p.id,q.no), paperId:p.id, paperCat:p.cat, no:q.no, t:q.t, s:q.s, o:q.o, a:q.a, e:q.e, m:q.m, md:q.md}; }
function startPaper(pid, mode){
  var p=paperCache[pid];
  var list=p.qs.map(function(q){ return mkQ(p,q); });

    confirmModal("开始考试","考试模式：90 分钟倒计时，全部答完或手动交卷后才能看到对错。<b>中途退出将直接交卷</b>，且不保存进度。确定开始？","开始考试",function(){ startQuiz({mode:"exam",title:p.name,list:list,order:order,idx:0,answers:{},revealed:{},source:"paper",paperId:pid,seconds:0}); });
  } else if (mode==="recite"){
    startQuiz({mode:"recite",title:p.name+" · 背题",list:list,order:order,idx:0,answers:{},revealed:{},source:"paper",paperId:pid,seconds:0});
  } else {
    if (progress[pid] && Object.keys(progress[pid].answers||{}).length){
      confirmModal("重新练习","这套卷有未完成的练习进度。<b>重新开始</b>会清掉已有进度（错题集和收藏不受影响），继续吗？","清掉重刷",function(){ delete progress[pid]; save("progress",progress); startQuiz({mode:"practice",title:p.name,list:list,order:order,idx:0,answers:{},revealed:{},source:"paper",paperId:pid,seconds:0}); });
    } else startQuiz({mode:"practice",title:p.name,list:list,order:order,idx:0,answers:{},revealed:{},source:"paper",paperId:pid,seconds:0});
  }
}
function startQuiz(cfg){

    examSave = {title:cfg.title, source:cfg.source, paperId:cfg.paperId||"", customId:cfg.customId||"",
      qkeys:cfg.order.map(function(i){return cfg.list[i].qk;}), answers:{}, startTs:cfg.startTs, deadline:cfg.deadline};
  }
  cfg.expOpen=(cfg.mode==="recite");   // 背题模式解析默认展开
  // 恢复进度时若当前题已作答 → 解析默认展开（否则往回翻看不到判定/解析要手动点）
  var _cur0 = (cfg.list && cfg.order) ? cfg.list[cfg.order[cfg.idx||0]] : null;
  if (cfg.mode==="practice" && _cur0 && cfg.revealed && cfg.revealed[_cur0.qk]) cfg.expOpen=true;

function pickOpt(v){
  if (Date.now()-lastSwipeAt < 300) return;   // 刚滑动/拖拽翻过页，忽略残留的点击
  var qz=app.quiz, it=qz.list[qz.order[qz.idx]], q=it;
  if (qz.mode==="recite") return;              // 背题模式只看不答
  if (qz.mode==="practice" && qz.revealed[it.qk]) return;
  if (q.t==="multi"||q.t==="uncertain"){
    var cur=(qz.answers[it.qk]||"").split("");
    var i=cur.indexOf(v); if(i>=0) cur.splice(i,1); else cur.push(v);
    qz.answers[it.qk]=cur.sort().join("");
  } else {
    qz.answers[it.qk]=v;
    if (qz.mode==="practice") revealCurrent();
  }
  if (qz.mode==="exam" && examSave) examSave.answers=shallowAnswers();
  if (qz.mode==="practice") saveProgress();
  refresh();
}
function confirmMulti(){
  var qz=app.quiz, it=qz.list[qz.order[qz.idx]];
  if (!qz.answers[it.qk]){ toast("请先选择答案"); return; }
  revealCurrent(); saveProgress(); refresh();
}
function revealCurrent(){
  var qz=app.quiz, it=qz.list[qz.order[qz.idx]], q=it;
  var sel=qz.answers[it.qk]||"";
  qz.revealed[it.qk]=true;
  var ok=judge(q,sel);
  var mastered=markAnswered(it.qk, ok);
  addRecord(ok, qz.tickSeconds||0);
  qz.tickSeconds=0;
  if (mastered) toast("连对 2 次，已移出错题集（已掌握）");
  else if (!ok) toast("已加入错题集");
  // 答对自动进下一题（答错留在当前页看解析，需手动点）
  if (ok && settings.autoNext!==false && qz.mode==="practice" && qz.idx < qz.order.length-1){
    clearTimeout(qz._autoNext);
    qz._autoNext = setTimeout(function(){
      if (app.quiz===qz && app.view==="quiz" && qz.idx < qz.order.length-1) move(1);
    }, 700);
  }
}
function toggleExp(){ app.quiz.expOpen=!app.quiz.expOpen; refresh(); }
function move(d){
  var qz=app.quiz, n=qz.idx+d;
  if (n<0||n>=qz.list.length) return;
  clearTimeout(qz._autoNext);          // 手动翻页时取消待执行的自动跳转，避免连跳两题
  qz._slideDir = d;                    // 记录翻页方向，供 renderQuiz 播放滑入动画
  qz.idx=n;
  var _c=qz.list[qz.order[n]];
  qz.expOpen = (qz.mode==="recite") || (qz.mode==="practice" && !!(_c && qz.revealed[_c.qk]));
  if (qz.mode==="practice") saveProgress();

function saveProgress(){

  progress[qz.paperId]={idx:qz.idx, answers:qz.answers, revealed:qz.revealed, savedAt:Date.now()};

function finishPractice(){
  var qz=app.quiz;
  if (qz.mode==="recite"){
    confirmModal("完成背题","本次共背了 "+qz.list.length+" 题。背题不计入今日刷题量，本次时长已计入统计。","结束",function(){
      app.quiz=null; nav("home"); syncNow(false);
    });
    return;
  }
  // 累加该卷练习统计（每次完成练习记 1 次；sessions/answered/correct）
  if (qz.source==="paper"){
    var ans=0, ok=0;
    qz.list.forEach(function(it){
      if (qz.revealed[it.qk]){
        ans++;
        if (judge(it, qz.answers[it.qk]||"")) ok++;
      }
    });
    addPaperStat(qz.paperId, ans, ok);
  }
  saveProgress();
  confirmModal("完成练习","本套练习已完成 "+Object.keys(qz.revealed).length+" 题。"+(qz.source==="paper"?"进度已保存，下次可继续。":""),"结束",function(){
    var t=totalStats();
    if (!settings.backupHint && t.c>=30){ /* 提示在 addRecord 里已做过 */ }

  });
}
function shallowAnswers(){
  var qz=app.quiz, o={};
  for (var k in qz.answers) o[k]=qz.answers[k];
  return o;
}
function submitExam(auto){
  var qz=app.quiz;
  var correct=0, wrongList=[], blank=[];
  qz.list.forEach(function(it){
    var sel=qz.answers[it.qk]||"";
    if (!sel){ blank.push({q:it, sel:""}); return; }   // 未作答：不判错、不入错题集、不计刷题量
    var ok=judge(it,sel);
    if (ok) correct++; else wrongList.push({q:it, sel:sel});
    markAnswered(it.qk, ok);
    addRecord(ok, 0);
  });
  // 累加该卷考试统计（每次交卷记 1 次；submitted 含补交卷——recoverExam 已去重 exam_inflight 故仅一次）
  if (qz.source==="paper") addPaperStat(qz.paperId, correct+wrongList.length, correct);
  var seconds=Math.round((Date.now()-qz.startTs)/1000);
  var log=load("examlog",[]); log.unshift({name:qz.title, ts:Date.now(), correct:correct, total:qz.list.length, blank:blank.length, s:seconds});
  save("examlog",log.slice(0,50));
  localStorage.removeItem(K+"exam_inflight");   // 已交卷，清除中断存档，防止下次打开误补交
  examSave=null;
  app.lastResult={correct:correct, total:qz.list.length, wrongList:wrongList, blank:blank, seconds:seconds, mode:qz.mode};
  app.quiz=null; app.view="result"; refresh(); window.scrollTo(0,0);
  if (auto) toast("考试时间到，已自动交卷");
  syncNow(false);   // 交卷后立即同步（考试退出/手动交卷/到时自动交卷都走这里）
}
function exitExam(){
  var qz=app.quiz; if(!qz) return;
  // 检查未作答（空白视为未答；多选未点"确认"也视为未答，答案并不入卷）
  var blankN=0; qz.list.forEach(function(it){ if(!qz.answers[it.qk]) blankN++; });
  if (blankN>0){
    // 自定义二选一弹窗：取消并交卷（红色）/ 跳转
    window._confirmForce = function(){ hideModal(); submitExam(false); };
    window._confirmJump = function(){ hideModal(); showSheet(true); };
    showModal(
      '<h3 style="margin:0 0 .6rem">未完成提醒</h3>'+
      '<p class="sub" style="margin:0 0 1rem;line-height:1.7">检测到有 <b style="color:var(--warn);font-size:1.1em">'+blankN+'</b> 道题没做。<br>'+
      '空白题不会计入错题集、也不参与判分。是否仍要交卷？</p>'+
      '<div style="display:flex;gap:.6rem">'+
        '<button class="btn bad grow" onclick="_confirmForce()">取消并交卷</button>'+
        '<button class="btn ok grow" onclick="_confirmJump()">跳转</button>'+
      '</div>'
    );
    return;
  }
  confirmModal("您目前处于考试模式","若中途退出将<b>不会保存考试进度</b>，并且<b>直接交卷结束考试</b>。确定交卷吗？","直接交卷",function(){ submitExam(false); }, true);
}
function tickTimer(){
  var qz=app.quiz; if(!qz||qz.mode!=="exam") return;
  var el=document.getElementById("examTimer"); if(!el) return;
  var left=Math.max(0, qz.deadline-Date.now());
  var m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  el.textContent="剩余 "+m+":"+String(s).padStart(2,"0");
  el.className="timer"+(left<5*60000?" hot":"");
  if (left<=0){ submitExam(true); return; }

/* 答题卡 —— highlightBlank=true 时未作答题用黄色填充强调 */
function showSheet(highlightBlank){
  var qz=app.quiz; if(!qz) return;
  // 统计：练习模式按 revealed+judge；考试/背题按 answers（仅标已答不判对错）
  var _ok=0,_bad=0,_ans=Object.keys(qz.answers||{}).length,_rev=Object.keys(qz.revealed||{}).length;
  if (qz.mode==="practice"){
    Object.keys(qz.revealed).forEach(function(qk){
      var it=qz.list.find(function(x){return x.qk===qk;});
      if (!it) return;
      if (judge(it, qz.answers[qk])) _ok++; else _bad++;
    });
  }
  var counts = '';
  if (qz.mode==="practice"){
    counts = '<span class="cok"><i>✓</i>'+_ok+'</span><span class="cbad"><i>✗</i>'+_bad+'</span>';
  } else if (qz.mode==="exam"){
    counts = '<span style="color:var(--sub);font-weight:500">已答 '+_ans+'/'+qz.list.length+'</span>';
  } else {
    counts = '<span style="color:var(--sub);font-weight:500">已看 '+_ans+'/'+qz.list.length+'</span>';
  }
  var legend = '<div class="legend">'+
    (qz.mode==="practice"
      ? '<span><i style="background:var(--ok)"></i>答对</span><span><i style="background:var(--bad)"></i>答错</span>'
      : '<span><i style="background:var(--pri)"></i>已答</span>')+
    (highlightBlank?'<span><i style="background:var(--warn)"></i>未作答</span>':' <span><i style="background:var(--card2);border:1px solid var(--line)"></i>未答</span>')+
    '</div>';
  var grid = '<div class="sheet">';
  qz.order.forEach(function(oi,i){
    var it=qz.list[oi], cls="";
    if (qz.mode==="practice" && qz.revealed[it.qk]){
      cls = judge(it, qz.answers[it.qk]) ? "ok" : "bad";
    } else if (qz.answers[it.qk]){
      cls = "ans";
    } else if (highlightBlank){
      cls = "blank";
    }
    if (i===qz.idx) cls += " cur";
    grid += '<button class="'+cls+'" onclick="jumpTo('+i+')" aria-label="第 '+(it.no)+' 题">'+(i+1)+'</button>';
  });
  grid += '</div>';
  showModal(
    '<div class="sheet-head"><h3 style="margin:0">答题卡</h3><div class="sheet-counts">'+counts+'</div></div>'+
    legend + grid +
    (highlightBlank
      ? '<button class="btn ok block" style="margin-top:.9rem" onclick="jumpToBlank()">跳到第一道未作答</button>'
      : '')+
    '<button class="btn ghost block" style="margin-top:.6rem" onclick="hideModal()">关闭</button>'
  );
}

  keys.forEach(function(k){ pids[k.slice(0,k.lastIndexOf(":"))]=1; });
  return loadPapers(Object.keys(pids)).then(function(){

function doStartKeys(keys, title, shuffle, source, mode, customId){

  buildListFromKeys(keys).then(function(list){
    hideLoading();
    if (!list.length){ toast("题目加载失败"); return; }
    if (shuffle) list.sort(function(){return Math.random()-0.5;});
    var order=list.map(function(_,i){return i;});
    if (mode==="exam"){
      confirmModal("开始考试","90 分钟倒计时，中途退出将直接交卷。确定开始？","开始考试",function(){
        startQuiz({mode:"exam",title:title,list:list,order:order,idx:0,answers:{},revealed:{},source:source,customId:customId,seconds:0});
      });
    } else {
      startQuiz({mode:mode==="recite"?"recite":"practice",title:title,list:list,order:order,idx:0,answers:{},revealed:{},source:source,customId:customId,seconds:0});
    }
  }).catch(function(){ hideLoading(); toast("加载失败"); });
}

function generateCustom(){
  var name=document.getElementById("cpName").value.trim();
  var sel=Array.prototype.map.call(document.querySelectorAll("#cpPapers input:checked"),function(c){return c.value;});
  if (!sel.length){ toast("请至少选择一套试卷"); return; }
  var status=document.querySelector("#cpStatus .on").dataset.v;
  var types=Array.prototype.map.call(document.querySelectorAll("#cpTypes .on"),function(b){return b.dataset.v;});
  var cntBtn=document.querySelector("#cpCount .on").dataset.v;
  var n=cntBtn==="custom"?(parseInt(document.getElementById("cpCustomN").value,10)||0):parseInt(cntBtn,10);
  if (!name) name="组卷 "+new Date().toLocaleDateString();
  if (!n||n<5){ toast("题数至少 5 题"); return; }
  showLoading("正在组卷…");
  loadPapers(sel).then(function(){
    var pool=[];
    sel.forEach(function(pid){
      paperCache[pid].qs.forEach(function(q){
        var k=qKey(pid,q.no);
        if (status==="undone" && doneMap[k]) return;
        if (status==="wrong" && !wrongMap[k]) return;
        if (types.length && types.indexOf(q.t)<0) return;
        if (!q.a) return;                       // 没答案的题不进组卷
        pool.push(k);
      });
    });
    if (status==="wrong") pool.sort(function(a,b){ return wrongMap[b].at-wrongMap[a].at; });
    else pool.sort(function(){return Math.random()-0.5;});
    var picked=pool.slice(0,n);

/* 手势翻页统一由 initSwipe() 处理（下方），此处不再重复绑定 */

/* ================= 滑动 / 拖拽翻页 =================
   手机：手指左右滑动；电脑：按住左键左右拖拽。
   从右向左 = 下一题，从左向右 = 上一题。
   只在答题页生效，且与纵向滚动互斥（水平位移需明显大于垂直位移）。 */
var swipe = null, lastSwipeAt = 0;
function initSwipe(){
  /* 监听绑定在 document（全屏任何位置都能滑动翻页），由门控判断是否生效：
     仅答题页、单指/左键、弹窗未打开、起点不在按钮/输入框/更新横幅上 */
  if (!document.getElementById("view")) return;

  function inQuiz(){ return app.view==="quiz" && !!app.quiz; }
  function modalOpen(){ return document.getElementById("modal").classList.contains("show"); }
  function isInteractive(el){
    return el && el.closest && el.closest("button, input, select, textarea, a, .exp-toggle, .opt, #updbar");
  }

  /* ---- 触摸端（不在触摸起点排除按钮等元素：手机上选项占大半屏，
     排除会缩小可滑区域；轻点仍由 click 正常触发，两者不冲突） ---- */
  document.addEventListener("touchstart", function(e){
    swipe = (inQuiz() && !modalOpen() && e.touches.length===1)
      ? {x:e.touches[0].clientX, y:e.touches[0].clientY, src:"touch"} : null;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (!swipe || swipe.src!=="touch") return;
    var t = e.changedTouches[0], dx = t.clientX-swipe.x, dy = t.clientY-swipe.y;
    swipe = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)*1.3) return;  // 纵向滚动或位移太小 → 不翻页
    lastSwipeAt = Date.now();
    if (dx < 0) move(1); else move(-1);
  }, {passive:true});
  document.addEventListener("touchcancel", function(){ swipe=null; }, {passive:true});

  /* ---- 电脑端：按住左键拖拽（划词保护：有选区/慢拖/斜拖均不翻页） ---- */
  function selLen(){
    try{ var s=window.getSelection(); return s ? s.toString().trim().length : 0; }catch(e){ return 0; }
  }
  document.addEventListener("mousedown", function(e){
    swipe = (inQuiz() && !modalOpen() && e.button===0 && settings.dragFlip!==false && !isInteractive(e.target))
      ? {x:e.clientX, y:e.clientY, src:"mouse", t0:Date.now()} : null;
  });
  document.addEventListener("mousemove", function(e){
    if (!swipe || swipe.src!=="mouse") return;
    // 拖出较长选区（≥8字）→ 明确在划词/复制，取消手势。
    // 注意：快速甩动时浏览器也会自动选中 1~2 个字符，故不能"有选区即取消"。
    if (selLen() >= 8){ swipe=null; return; }
    var dx = e.clientX-swipe.x, dy = e.clientY-swipe.y;
    if (Math.abs(dx) < 90 || Math.abs(dx) < Math.abs(dy)*1.6) return;   // 位移不足或偏纵向 → 不翻页
    var dt = Math.max(Date.now()-swipe.t0, 1);
    swipe = null;
    // 划词是慢速移动的：时长 >300ms 或速度 <1.2px/ms 均判为划词，不翻页
    if (dt > 300 || Math.abs(dx)/dt < 1.2) return;
    lastSwipeAt = Date.now();
    if (dx < 0) move(1); else move(-1);
  });
  document.addEventListener("mouseup", function(){ swipe=null; });

  /* ---- 电脑端：键盘左右方向键翻题（与滑动方向一致：→下一题 ←上一题） ---- */
  document.addEventListener("keydown", function(e){
    if (!inQuiz()) return;
    if (e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
    if (document.getElementById("modal").classList.contains("show")) return;  // 弹窗打开时不翻题
    var tag = e.target && e.target.tagName;
    if (tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT") return;          // 输入控件内不劫持方向键
    move(e.key==="ArrowRight" ? 1 : -1);
  });

  /* ---- 电脑端：滚轮翻页（三模式通用） ----
     与纵向滚动协调：题目内容超出一屏时，滚轮先正常滚动页面；
     滚到页底继续向下滚 → 翻下一题，滚到页顶继续向上滚 → 翻上一题。
     连续滚动累计 ≥240px 才触发一次翻页，翻页后 700ms 冷却，
     期间吞掉触控板惯性滚动（防止连翻数页）。 */
  var wheelAcc = 0, wheelLockUntil = 0, lastWheelAt = 0;
  document.addEventListener("wheel", function(e){
    if (!inQuiz() || settings.wheelFlip===false) return;
    if (modalOpen()) return;                       // 弹窗（答题卡/设置/确认框）打开时不劫持
    var now = Date.now();
    if (now - lastWheelAt > 300) wheelAcc = 0;     // 距上次超过 300ms 视为新的一次滚动
    lastWheelAt = now;
    if (now < wheelLockUntil){ e.preventDefault(); return; }   // 冷却期：吞掉惯性
    var dy = e.deltaY * (e.deltaMode===1 ? 40 : 1);            // Firefox 行模式换算
    if (!dy) return;
    var doc = document.documentElement;
    var canScroll = doc.scrollHeight - window.innerHeight > 8;
    if (canScroll){
      var atBottom = window.innerHeight + window.scrollY >= doc.scrollHeight - 4;
      var atTop    = window.scrollY <= 4;
      if ((dy > 0 && !atBottom) || (dy < 0 && !atTop)){ wheelAcc = 0; return; }  // 页面还能滚 → 交给自然滚动
    }
    wheelAcc += dy;
    if (Math.abs(wheelAcc) >= 240){
      wheelAcc = 0;
      wheelLockUntil = now + 700;
      e.preventDefault();
      move(dy > 0 ? 1 : -1);
    }
  }, {passive:false});
}

/* ================= 云同步（Gitee 私有仓库） =================
   凭证存本机。每个同步码对应仓库里一个独立文件，不同码互不干扰。
   同步策略：启动时拉取合并；数据变更后 5 分钟自动推送；可手动立即同步。 */
var syncCfg   = load("sync", null);   // {token, repo, code, branch, lastSync}
var syncDirty = false, syncTimer = null, syncing = false;
var SYNC_KEYS = ["progress","done","wrong","fav","records","customs","examlog","paperStats"];

function genCode(){
  var s="ABCDEFGHJKMNPQRSTUVWXYZ23456789", o="";
  for (var i=0;i<6;i++) o+=s[Math.floor(Math.random()*s.length)];
  return o;
}
function b64e(str){
  var u=new TextEncoder().encode(str), bin="";
  for (var i=0;i<u.length;i++) bin+=String.fromCharCode(u[i]);
  return btoa(bin);
}
function b64d(b64){
  var bin=atob(String(b64).replace(/\s/g,"")), u=new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(u);
}
function gitee(method, path, body){
  var opt={method:method, headers:{"Content-Type":"application/json"}};
  if (body) opt.body=JSON.stringify(body);
  return fetch("https://gitee.com/api/v5"+path+(path.indexOf("?")>=0?"&":"?")+"access_token="+encodeURIComponent(syncCfg.token), opt)
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if (!r.ok) throw new Error((j&&j.message) || ("HTTP "+r.status));
        return j;
      });
    });
}
function snapshot(){
  return {v:1, ts:Date.now(), progress:progress, done:doneMap, wrong:wrongMap,
          fav:favMap, records:records, customs:customs, examlog:load("examlog",[]), paperStats:paperStats};
}
function mergeSnap(s){
  if (!s) return 0;
  var n=0, k;
  for (k in (s.progress||{})){ var p=s.progress[k];
    if (!progress[k] || (p.savedAt||0)>(progress[k].savedAt||0)){ progress[k]=p; n++; } }
  for (k in (s.done||{})){ if (s.done[k]==="wrong" ? doneMap[k]!=="wrong" : !doneMap[k]){ doneMap[k]=s.done[k]; n++; } }
  for (k in (s.wrong||{})){ var w=s.wrong[k];
    if (!wrongMap[k] || (w.at||0)>(wrongMap[k].at||0)){ wrongMap[k]=w; n++; } }
  for (k in (s.fav||{})){ if (!(k in favMap) || s.fav[k]>favMap[k]){ favMap[k]=s.fav[k]; n++; } }
  for (k in (s.records||{})){ var r=s.records[k], l=records[k];
    if (!l){ records[k]={c:r.c||0,r:r.r||0,s:r.s||0}; n++; }
    else ["c","r","s"].forEach(function(f){ if ((r[f]||0)>(l[f]||0)){ l[f]=r[f]; n++; } }); }
  (s.customs||[]).forEach(function(c){
    var i=customs.findIndex(function(x){return x.id===c.id;});
    if (i<0){ customs.push(c); n++; }
    else if ((c.ts||0)>(customs[i].ts||0)){ customs[i]=c; n++; }
  });
  for (k in (s.paperStats||{})){
    var ps=s.paperStats[k], l=paperStats[k];
    if (!l || (ps.sessions||0)>(l.sessions||0)) paperStats[k]=ps;  // 整体替换：取 sessions 较大者（避免双设备累加导致虚高）
    else { l.sessions=Math.max(l.sessions||0,ps.sessions||0); l.answered=Math.max(l.answered||0,ps.answered||0); l.correct=Math.max(l.correct||0,ps.correct||0); }
    if (paperStats[k]===ps) n++;
  }
  var log=load("examlog",[]), seen={};
  log.forEach(function(x){ seen[x.ts+"|"+x.name]=1; });
  (s.examlog||[]).forEach(function(x){
    var key=x.ts+"|"+x.name;
    if (!seen[key]){ seen[key]=1; log.push(x); n++; }
  });
  if (n){
    log.sort(function(a,b){ return b.ts-a.ts; });
    save("examlog", log.slice(0,200));
    save("progress",progress); save("done",doneMap); save("wrong",wrongMap);
    save("fav",favMap); save("records",records); save("customs",customs);
    save("paperStats", paperStats);
  }
  return n;
}
function setSyncStatus(txt){
  var el=document.getElementById("syncStatus");
  if (el) el.textContent=txt;
}
function syncNow(manual){
  if (!syncCfg || !syncCfg.token || !syncCfg.repo){
    if (manual) toast("请先在设置中配置云同步");
    return Promise.resolve(false);
  }
  if (syncing){ if (manual) toast("正在同步中…"); return Promise.resolve(false); }
  syncing=true;
  if (manual) setSyncStatus("同步中…");
  var path="/repos/"+syncCfg.repo+"/contents/tiku-sync/"+syncCfg.code+".json";
  return gitee("GET", path).catch(function(e){
    if (/404|Not Found|不存在|未找到/i.test(String(e&&e.message))) return null;
    throw e;
  }).then(function(j){
    if (j && !j.sha) j=null;  // Gitee 对不存在的文件返回 200+空数组，视为不存在
    var remote=null;
    if (j){ try{ remote=JSON.parse(b64d(j.content)); }catch(err){ remote=null; } }
    var n=mergeSnap(remote);
    var localStr=JSON.stringify(snapshot());
    if (remote && n===0 && !syncDirty && JSON.stringify(remote)===localStr){
      syncing=false; syncDirty=false;
      syncCfg.lastSync=Date.now(); save("sync",syncCfg);
      setSyncStatus("云端已是最新 "+new Date().toLocaleTimeString());
      if (manual) toast("云端已是最新");
      return true;
    }
    var body={content:b64e(localStr), message:"sync "+syncCfg.code, branch:syncCfg.branch||"master"};
    // Gitee：更新已有文件必须带文件 sha 用 PUT；新建文件不能带 sha 用 POST
    var req;
    if (j && j.sha){ body.sha=j.sha; req=gitee("PUT", path, body); }
    else { req=gitee("POST", path, body); }
    return req.then(function(){
      syncing=false; syncDirty=false;
      syncCfg.lastSync=Date.now(); save("sync",syncCfg);
      setSyncStatus("已同步 "+new Date().toLocaleTimeString()+(n?"（合并 "+n+" 条）":""));
      if (manual) toast(n ? "已同步，合并 "+n+" 条更新" : "已上传到云端");
      return true;
    });
  }).catch(function(e){
    syncing=false;
    var msg=String((e&&e.message)||e);
    setSyncStatus("同步失败："+msg.slice(0,60));
    if (manual) toast("同步失败："+msg.slice(0,60));
    return false;
  });
}
function scheduleSync(){
  if (!syncCfg || !syncCfg.token || !syncCfg.repo) return;
  syncDirty=true;
  if (syncing || syncTimer) return;
  // 自动同步：数据变化后尽快推送，但至少间隔 60 秒（Gitee 每次同步都会产生一条 commit，过于频繁会限流+历史膨胀）
  var wait=Math.max(0, 60*1000-(Date.now()-(syncCfg.lastSync||0)));
  if (wait===0){ syncNow(false); return; }
  syncTimer=setTimeout(function(){ syncTimer=null; if (syncDirty) syncNow(false); }, wait);
}
function saveSyncFromForm(){
  var tk=document.getElementById("syncTk"), rp=document.getElementById("syncRepo"), cd=document.getElementById("syncCode");
  if (!tk || !cd) return;
  var token=tk.value.trim(), code=cd.value.trim().toUpperCase();
  // 仓库名规范化：粘贴的配置串里存的是"用户名/仓库"完整名，再拼前缀会变成双前缀导致 Gitee 报错，这里只取最后一段
  var repo=(rp.value.trim()||"tiku-sync").replace(/^.*\//,"")||"tiku-sync";
  if (!token || !code){ toast("请填写令牌和同步码"); return; }
  setSyncStatus("验证令牌中…");
  syncCfg={token:token, repo:repo, code:code};   // 临时供 gitee() 使用
  gitee("GET","/user").then(function(u){
    var owner=u.login, full=owner+"/"+repo;
    setSyncStatus("检查仓库中…");
    return gitee("GET","/repos/"+full).then(function(r){
      syncCfg.repo=full; syncCfg.branch=r.default_branch||"master";
      return true;
    }).catch(function(){
      setSyncStatus("创建私有仓库 "+repo+" 中…");
      return gitee("POST","/user/repos",{name:repo, private:true, auto_init:true, has_issues:false, has_wiki:false})
        .then(function(r){ syncCfg.repo=full; syncCfg.branch=r.default_branch||"master"; });
    });
  }).then(function(){
    syncCfg.lastSync=(load("sync",{})||{}).lastSync||0;
    save("sync",syncCfg);
    return syncNow(true);
  }).then(function(){ refresh(); }).catch(function(e){
    setSyncStatus("");
    toast("配置失败："+String(e&&e.message||e).slice(0,60));
  });
}
function disableSync(){
  confirmModal("停用云同步","云端仓库里的备份会保留，本机数据不受影响。确定停用吗？","停用",function(){
    syncCfg=null; localStorage.removeItem(K+"sync"); syncDirty=false;
    clearTimeout(syncTimer); syncTimer=null;
    refresh(); toast("已停用云同步");
  });
}

/* ===== 同步配置迁移：换链接/换设备一键复制恢复 ===== */
function cfgToStr(o){
  return "TS1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function strToCfg(s){
  var t=(s||"").trim();
  if(t.indexOf("TS1:")===0) t=t.slice(4);
  t=t.replace(/\s+/g,"");
  if(!t) throw new Error("empty");
  var o=JSON.parse(decodeURIComponent(escape(atob(t))));
  if(!o || !o.token || !o.code) throw new Error("bad");
  // 兼容旧版配置串：repo 可能存的是"用户名/仓库"完整名，填表单前剥成短名，避免保存时拼出双前缀
  o.repo=String(o.repo||"").replace(/^.*\//,"")||"tiku-sync";
  return o;
}
function copySyncCfg(){
  if(!syncCfg || !syncCfg.token){ toast("尚未配置云同步"); return; }
  var s=cfgToStr({token:syncCfg.token, repo:syncCfg.repo, code:syncCfg.code});
  function done(){ toast("已复制，请粘贴到私密备忘录保存"); }
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=s; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    if(ok) done(); else prompt("请手动复制同步配置：", s);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(done, fallback);
  } else fallback();
}
function restoreSyncCfg(){
  var el=document.getElementById("syncPaste");
  if(!el) return;
  var o;
  try{ o=strToCfg(el.value); }
  catch(e){ toast("配置格式不对，请粘贴「复制同步配置」得到的完整内容"); return; }
  document.getElementById("syncTk").value=o.token;
  document.getElementById("syncRepo").value=o.repo;
  document.getElementById("syncCode").value=o.code;
  toast("已填入，请点「保存并启用云同步」完成验证");
}

/* ================= 启动 ================= */
(function init(){
  applyTheme();
  initSwipe();
  showLoading("加载题库索引…");
  loadIndex().then(function(idx){
    bankIndex=idx.papers;
    return recoverExam();
  }).then(function(){
    hideLoading(); refresh();
  }).catch(function(){
    hideLoading();
    document.getElementById("view").innerHTML =
      '<div class="card"><div class="empty"><b>题库加载失败</b><br>请通过在线链接打开本应用，<br>或在电脑上用本地服务器启动（不能直接双击文件打开）。</div></div>';
  });
  // 更新检查：启动后 3 秒查一次，之后每 5 分钟一次，切回前台时也查
  setTimeout(function(){ checkUpdate(false); }, 3000);
  setInterval(function(){ checkUpdate(false); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") checkUpdate(false);
  });
  // 云同步：启动后自动拉取合并一次；数据变更后由 scheduleSync 定时推送
  if (syncCfg && syncCfg.token) setTimeout(function(){ syncNow(false); }, 6000);
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && syncDirty) syncNow(false);
  });
})();
</script>
